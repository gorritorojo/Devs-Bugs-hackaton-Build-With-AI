<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[var(--primary)] via-[#4a9aa0] to-[#3a7a80] p-4"
>
  <p-card
    class="w-full max-w-md"
    styleClass="shadow-2xl rounded-2xl border-0 animate-fade-in-up"
  >
    <ng-template pTemplate="title">
      <div class="text-center mb-4 pt-4">
        <i class="pi pi-users text-5xl mb-3 text-[var(--primary)]"></i>
        <h1 class="text-3xl font-bold m-0 text-[var(--primary)]">CrowdBuy</h1>
        <p class="text-sm text-gray-500 mt-2">
          Compras comunitarias del campo a tu mesa
        </p>
      </div>
    </ng-template>
    <ng-template pTemplate="content">
      <p class="text-center text-gray-500 text-sm mb-6">
        Selecciona tu perfil para continuar
      </p>
      <div class="flex flex-col gap-3">
        <button
          type="button"
          pButton
          pRipple
          class="w-full"
          styleClass="p-button-outlined py-3"
          (click)="login('pyme')"
        >
          <i class="pi pi-shop mr-2"></i>
          Entrar como PYME
        </button>
        <button
          type="button"
          pButton
          pRipple
          class="w-full py-3 !bg-[var(--secondary)] !border-[var(--secondary)]"
          (click)="login('agro')"
        >
          <i class="pi pi-sun mr-2"></i>
          Entrar como Productor
        </button>
      </div>
    </ng-template>
  </p-card>
</div>
